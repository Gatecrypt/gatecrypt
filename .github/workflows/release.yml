name: Release

# Push a tag v<version> to publish packages/gatecrypt to npm.
# Publishing uses npm trusted publishing (OIDC): no token is stored here. The
# package's settings on npmjs.com must name this repository and this workflow.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag is the version in package.json
        run: test "v$(node -p "require('./packages/gatecrypt/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm --filter gatecrypt run test
      - run: pnpm --filter gatecrypt run check:package --release
      - run: pnpm --filter @gatecrypt/browser-tests exec playwright install --with-deps chromium
      - run: pnpm test:browser
      # Packed by pnpm, published by npm: trusted publishing is npm's own feature, and
      # needs npm 11.5.1 or newer. The tarball is the one check:package just examined.
      - run: npm install --global npm@^11.5.1
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
        working-directory: packages/gatecrypt
      - run: npm publish "$RUNNER_TEMP"/pack/gatecrypt-*.tgz --access public --provenance
