name: An idea
description: Something the package should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The situation, before the solution. What does the package make hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
